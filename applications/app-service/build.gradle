apply plugin: 'org.springframework.boot'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"
    implementation "ch.qos.logback:logback-core:${logbackVersion}"
    implementation "net.logstash.logback:logstash-logback-encoder:${logstashLogbackVersion}"
    implementation 'org.codehaus.janino:janino:3.1.12'
    implementation 'org.codehaus.janino:commons-compiler:3.1.12'


    // Módulos del proyecto
    implementation project(':sqs-sender')
    implementation project(':dynamo-db')
    implementation project(':metrics')
    implementation project(':sqs-listener')
    implementation project(':infrastructure:driven-adapters:redis')
    implementation project(':rest-consumer')
    implementation project(':reactive-web')
    implementation project(':r2dbc-postgresql')
    implementation project(':model')
    implementation project(':usecase')

    // Core Spring
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    // Otras dependencias
    implementation 'io.projectreactor:reactor-core'
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
    implementation 'org.reactivecommons.utils:object-mapper:0.1.0'

    // Desarrollo y pruebas
    runtimeOnly('org.springframework.boot:spring-boot-devtools')
    testImplementation 'com.tngtech.archunit:archunit:1.4.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
}
