server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: onboarding-reactivo
  main:
    web-application-type: reactive
  sql:
    init:
      mode: always
  r2dbc:
    url: "r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}

logging:
  level:
    org.springframework.r2dbc: DEBUG
    io.r2dbc.pool: DEBUG

# -------------------------------
# 🔹 Adaptadores de infraestructura
# -------------------------------
adapters:
  r2dbc:
    host: ${DB_HOST}
    port: ${DB_PORT}
    database: ${DB_NAME}
    schema: public
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
  # ELIMINAMOS EL BLOQUE 'adapters.sqs.sender' DE AQUI

# -------------------------------
# 🔹 Configuración de AWS
# -------------------------------
aws:
  endpoint: ${AWS_ENDPOINT:http://localhost:4566}

  region: ${AWS_REGION:us-east-1}

  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}

  dynamodb:
    table: ${AWS_DYNAMO_TABLE:user-events-table}

  sqs:
    region: ${aws.region}
    endpoint: ${aws.endpoint}
    queue-url: ${entrypoint.sqs.queue-url}

# -------------------------------
# 🔹 Configuración de SQS (Entrypoint)
# -------------------------------
# ESTE BLOQUE ES PARA 'SQSProperties' Y EL CLIENTE @Primary
entrypoint:
  sqs:
    region: ${aws.region}
    endpoint: ${aws.endpoint}
    queue-url: ${AWS_SQS_QUEUE_URL:http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/user-events-table}
    wait-time-seconds: ${AWS_SQS_WAIT_TIME:20}
    max-number-of-messages: ${AWS_SQS_MAX_MESSAGES:10}
    visibility-timeout-seconds: ${AWS_SQS_VISIBILITY_TIMEOUT:30}
    number-of-threads: ${AWS_SQS_THREADS:1}

# -------------------------------
# 🔹 Configuración del consumidor externo Reqres.in
# -------------------------------
reqres:
  base-url: ${REQRES_BASE_URL:https://reqres.in/api}
  api-key: ${REQRES_API_KEY:reqres-free-v1}

# -------------------------------
# 🔹 Adaptador REST (compatibilidad anterior)
# -------------------------------
adapter:
  restconsumer:
    timeout: 5000
    url: ${REQRES_BASE_URL:https://reqres.in/api}
    apikey: ${REQRES_API_KEY:reqres-free-v1}
  # ELIMINAMOS EL BLOQUE 'adapter.sqs.sender' DE AQUI

# -------------------------------
# 🔹 Configuración de CORS
# -------------------------------
cors:
  allowed-origins: http://localhost:4200,http://localhost:8080

# -------------------------------
# 🔹 Gestión, métricas y salud
# -------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

# -------------------------------
# 🔹 Configuración de Resilience4j
# -------------------------------
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 10s
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 10s
